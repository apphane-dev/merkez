name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so the sponsors wall (fetched from the GitHub Sponsors API
  # at build time) picks up new supporters without a manual push.
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Config mise
        run: mise settings experimental=true
      - name: Install dependencies
        run: mise install
      - name: Build
        run: mise run build
        env:
          # SPONSORS_GITHUB_TOKEN (PAT, no scopes needed for public
          # sponsorships) overrides the repo token if the GitHub App token
          # ever loses access to the GraphQL query.
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_GITHUB_TOKEN || github.token }}
      - name: Deploy to Cloudflare Pages
        # Call wrangler directly rather than via cloudflare/wrangler-action.
        # The action runs `npm i wrangler` inside the repo, which triggers npm's
        # full-tree resolution and fails on the project's nub-only peer deps.
        # `npx --yes` fetches wrangler into an isolated cache and runs it, never
        # touching the project tree. wrangler reads the token/account from env.
        run: npx --yes wrangler@4 pages deploy dist --project-name merkez --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
